spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autosmart}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.timeout=30m
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Não publicar contas/senhas demonstrativas em produção. Ative apenas em ambiente local.
autosmart.demo.enabled=${AUTOSMART_DEMO_ENABLED:false}
# Pontos de compatibilidade: soma = 100.
autosmart.recomendacao.peso-preco=30
autosmart.recomendacao.peso-categoria=15
autosmart.recomendacao.peso-cambio=15
autosmart.recomendacao.peso-ocupantes=15
autosmart.recomendacao.peso-consumo=10
autosmart.recomendacao.peso-finalidade=10
autosmart.recomendacao.peso-prioridades=5

autosmart.admin.email=${AUTOSMART_ADMIN_EMAIL:}
autosmart.admin.password=${AUTOSMART_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
