<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Veículos')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main><h1>Estoque de veículos</h1><div th:replace="~{fragments :: msgs}"></div>
<div class="card" sec:authorize="hasAnyRole('ADMIN','GERENTE')"><p><small>Cadastro restrito a Administrador e Gerente.</small></p><form class="f" th:action="@{/veiculos}" method="post">
<label>Foto personalizada (URL HTTPS, opcional)<input name="fotoUrl" type="url" placeholder="https://.../foto-do-veiculo.jpg"></label>
<label>Marca<input name="marca" required></label><label>Modelo<input name="modelo" required></label><label>Versão<input name="versao"></label>
<label>Ano<input name="ano" type="number" required></label><label>Cor<input name="cor"></label><label>Km<input name="km" type="number" min="0" required></label>
<label>Categoria<select name="categoria"><option>Hatch</option><option>Sedan</option><option>SUV</option><option>Picape</option></select></label>
<label>Câmbio<select name="cambio"><option>Manual</option><option>Automático</option></select></label>
<label>Lugares<input name="lugares" type="number" value="5"></label><label>Consumo (km/l)<input name="consumo" type="number" min="0" step="0.1" required></label>
<label>Localização<input name="localizacao" placeholder="Pátio Salvador" required></label>
<label>Finalidades (vírgulas)<input name="finalidades" placeholder="Cidade, Família"></label>
<label>Características (vírgulas)<input name="caracteristicas" placeholder="Ar-condicionado, Câmera de ré"></label>
<label>Preço (R$)<input name="preco" type="number" min="0.01" step="0.01" required></label><label>Cidade<select name="cidade"><option th:each="x:${cidades}" th:text="${x}"></option></select></label>
<button class="p">Cadastrar</button></form><p class="foto-ajuda">Sem foto personalizada? A vitrine exibe automaticamente uma imagem local ilustrativa para os 24 modelos de demonstração.</p></div>
<div class="card tw"><table><tr><th>Veículo</th><th>Cor</th><th>Km</th><th>Categoria</th><th>Câmbio</th><th>Preço</th><th>Situação</th><th>Cidade</th><th>Ações</th></tr>
<tr th:each="v:${lista}"><td><div class="estoque-carro"><img loading="lazy" th:src="${@imagensVeiculos.principal(v)}" th:attr="data-foto-local=${@imagensVeiculos.local(v)}" th:alt="${'Imagem ilustrativa de '+v.marca+' '+v.modelo}" onerror="this.onerror=null;this.src=this.dataset.fotoLocal;"><span th:text="${v.descricao()}"></span></div></td><td th:text="${v.cor}"></td><td th:text="${v.km}"></td><td th:text="${v.categoria}"></td><td th:text="${v.cambio}"></td>
<td th:text="${#numbers.formatDecimal(v.preco,1,'POINT',2,'COMMA')}"></td><td th:text="${v.status}"></td><td th:text="${v.cidade}"></td><td><a th:href="@{/veiculos/{id}/historico(id=${v.id})}">Histórico</a>
<a sec:authorize="hasAnyRole('ADMIN','GERENTE')" th:href="@{/veiculos/{id}/editar(id=${v.id})}">Editar</a></td></tr></table></div>
</main></body></html>
