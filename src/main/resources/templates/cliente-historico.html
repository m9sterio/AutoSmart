<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Histórico do cliente')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main><h1>Histórico do cliente</h1><p th:text="${cliente.nome}"></p>
<div class="card tw"><table><tr><th>Data</th><th>Ação</th><th>Usuário</th><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Ativo</th></tr>
<tr th:each="h:${lista}"><td th:text="${h.data}"></td><td th:text="${h.acao}"></td><td th:text="${h.usuario}"></td>
<td th:text="${h.nome}"></td><td th:text="${h.telefone}"></td><td th:text="${h.email}"></td><td th:text="${h.cidade}"></td><td th:text="${h.ativo}"></td></tr></table></div>
<a th:href="@{/clientes}">Voltar</a></main></body></html>
