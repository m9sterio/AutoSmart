<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(t)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${t}+' · AutoSmart'">AutoSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<nav th:fragment="nav"><b>Auto<span style="color:#10b981">Smart</span></b><a th:href="@{/painel}">Painel</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/clientes}">Clientes</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/veiculos}">Veículos</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/oportunidades}">Oportunidades</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/recomendacao}">Recomendação</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/testdrives}">Test-drives</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR')" th:href="@{/propostas}">Propostas</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','CONSULTOR','MECANICO')" th:href="@{/oficina}">Oficina</a><a sec:authorize="hasAnyRole('ADMIN','GERENTE','VENDEDOR','CONSULTOR')" th:href="@{/alertas}">Alertas</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">Usuários</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/configuracoes/recomendacao}">Pesos da IA</a>
<a th:href="@{/}">Site</a><form th:action="@{/logout}" method="post"><button>Sair</button></form></nav>
<div th:fragment="msgs"><div class="ok" th:if="${msg}" th:text="${msg}"></div><div class="err" th:if="${erro}" th:text="${erro}"></div></div>
</body></html>
