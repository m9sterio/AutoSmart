<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Oficina')}"></head><body><div th:replace="~{fragments :: nav}"></div><main><h1>Oficina e pós-venda</h1><div th:replace="~{fragments :: msgs}"></div>
<div class="card" sec:authorize="hasAnyRole('ADMIN','GERENTE','CONSULTOR')"><form class="f" th:action="@{/oficina}" method="post">
<label>Cliente<select name="clienteId"><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nome}"></option></select></label>
<label>Veículo<select name="veiculoId"><option th:each="v:${veiculos}" th:value="${v.id}" th:text="${v.descricao()}"></option></select></label>
<label>Solicitação<input name="descricao" required></label><button class="p">Abrir OS</button></form></div>
<div class="card" th:each="o:${lista}"><h3 th:text="'OS #'+${o.id}+' · '+${o.veiculo.descricao()}+' · '+${o.status}"></h3>
<p th:text="'Cliente: '+${o.cliente.nome}+' · Aberta em '+${o.abertura}+' · '+${o.descricao}"></p>
<form class="f" th:if="${o.status.name()!='ENCERRADA'}" th:action="@{/oficina/{id}/atualizar(id=${o.id})}" method="post">
<label>Diagnóstico<input name="diagnostico" th:value="${o.diagnostico}" required></label><label>Atividades<input name="atividades" th:value="${o.atividades}" required></label>
<label>Peças<input name="pecas" th:value="${o.pecas}" required></label><label>Valor (R$)<input name="valor" type="number" step="0.01" th:value="${o.valor}" required></label><button class="p">Salvar</button></form>
<form sec:authorize="hasAnyRole('ADMIN','GERENTE','CONSULTOR')" th:if="${o.status.name()!='ENCERRADA'}" th:action="@{/oficina/{id}/encerrar(id=${o.id})}" method="post" style="margin-top:8px"><button class="s">Encerrar OS</button></form>
<p th:if="${o.status.name()=='ENCERRADA'}" th:text="'Diagnóstico: '+${o.diagnostico}+' · Atividades: '+${o.atividades}+' · Peças: '+${o.pecas}+' · Valor: R$ '+${o.valor}"></p></div></main></body></html>
